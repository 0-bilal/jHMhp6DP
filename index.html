<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAITHA</title>
    <link rel="stylesheet" href="css/style.css">
        <link rel="icon" type="image/x-icon" href="ico/maitha.ico">
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>

    <div class="container">
        <div class="header">
            <h1 class="title">نهاية القصة</h1>
            <p class="subtitle">الوقت المنقضي منذ اللحظة الأخيرة</p>
        </div>

        <div class="card">
            <div class="time-grid">
                <div class="time-unit">
                    <div class="time-value" id="years">0</div>
                    <div class="time-label">سنة</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="months">0</div>
                    <div class="time-label">شهر</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="days">0</div>
                    <div class="time-label">يوم</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="hours">0</div>
                    <div class="time-label">ساعة</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="minutes">0</div>
                    <div class="time-label">دقيقة</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="seconds">0</div>
                    <div class="time-label">ثانية</div>
                </div>
            </div>

            <div class="end-date">
                <h3>تاريخ نهاية القصة</h3>
                <p>30 أغسطس 2024 - 1:47 مساءً</p>
            </div>

            <div class="story-message">
                <p><strong>منذ أن انتهت القصة...</strong></p>
                <p>يستمر الوقت في المضي، حاملاً الذكريات في صمت</p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
